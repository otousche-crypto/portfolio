<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conversations · Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Private page, not linked from the site: reads /api/conversations with the ADMIN_TOKEN password */
:root { --bg: #f1f1f4; --fg: #111114; --muted: #8a8a92; --line: rgba(15,15,18,.08); --ink: #2c2d32; --sel: #e6e6ec; }
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }

.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login form { width: min(360px, 100%); display: grid; gap: 12px; background: #fff; padding: 24px; border-radius: 20px; box-shadow: 0 0 0 1px var(--line); }
.login h1 { margin: 0; font-size: 18px; }
.login input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.login button, .btn { padding: 10px 16px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 500; cursor: pointer; }
.err { margin: 0; color: #c2410c; font-size: 13.5px; min-height: 1.2em; }

.app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: #fafafc; }
.side-top { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.side-top h1 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stats { margin: 0; color: var(--muted); font-size: 12.5px; }
.row { display: flex; gap: 6px; }
.row button { flex: 1; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; cursor: pointer; }
.row button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.tool { padding: 5px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 400; cursor: pointer; }
.list { flex: 1; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
.list button { width: 100%; display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; }
.list button:hover { background: #f0f0f4; }
.list button[aria-current="true"] { background: var(--sel); }
.list .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.list .q { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day { padding: 12px 12px 4px; color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

.main { min-height: 0; overflow-y: auto; }
.main-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(241,241,244,.85); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.main-top b { color: var(--fg); font-weight: 600; }
.back { display: none; }
.thread { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: min(600px, 88%); padding: 10px 14px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--ink); color: #fff; border-top-right-radius: 6px; margin-top: 14px; }
.msg.bot { align-self: flex-start; background: #fff; border-top-left-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.msg.bot a { color: inherit; }
.note { align-self: flex-start; color: var(--muted); font-size: 12px; padding-left: 4px; }
.note .tag { display: inline-block; padding: 1px 7px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px var(--line); margin-right: 4px; }
.note .tag.bad { color: #c2410c; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app.reading .side, .app:not(.reading) .main { display: none; }
  .back { display: inline-block; }
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form">
    <h1>Conversations de l’agent</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required>
    <button type="submit">Ouvrir</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-top">
      <h1>Conversations <button class="tool" type="button" id="logout">Se déconnecter</button></h1>
      <p class="stats" id="stats"></p>
      <div class="row" role="group" aria-label="Ordre">
        <button type="button" data-order="new" aria-pressed="true">Plus récentes</button>
        <button type="button" data-order="old" aria-pressed="false">Plus anciennes</button>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
  <main class="main" id="main">
    <div class="main-top"><button class="tool back" type="button" id="back">← Liste</button><span id="head"></span></div>
    <div class="thread" id="thread"><p class="empty">Choisissez une conversation.</p></div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'agent-admin';
  let pw = ''; try { pw = localStorage.getItem(KEY) || ''; } catch (e) {}
  let chats = [], order = 'new', current = -1;

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // Light markdown, as the agent writes it: **bold** and [label](url)
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|\/|[\w-]+\.html)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  const when = (iso, o) => new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', ...o });
  const LABEL = { canned: 'réponse toute prête', refusal: 'refus du modèle', max_tokens: 'réponse coupée' };
  const bad = (o) => o.startsWith('api_') || o === 'error' || o === 'refusal' || o === 'max_tokens';
  const ENDED = /\n?\[\[\s*(FIN|END)\s*\]\]\s*$/;

  // By conversation: the id drawn by the page; older logs, without one, are split at every first question
  const group = (logs, votes) => {
    const out = [], byCid = new Map();
    for (const l of [...logs].sort((a, b) => a.at.localeCompare(b.at))) {
      if (l.cid) {
        if (!byCid.has(l.cid)) { const c = { msgs: [], votes: [] }; byCid.set(l.cid, c); out.push(c); }
        byCid.get(l.cid).msgs.push(l);
      } else if (l.turn === 1 || !out.length || out.at(-1).msgs[0].cid) out.push({ msgs: [l], votes: [] });
      else out.at(-1).msgs.push(l);
    }
    for (const v of votes) if (v.cid && byCid.has(v.cid)) byCid.get(v.cid).votes.push(v);
    return out;
  };

  const show = (which) => { $('login').hidden = which !== 'login'; $('app').hidden = which !== 'app'; };

  const load = async () => {
    const r = await fetch('/api/conversations', { headers: { authorization: 'Bearer ' + pw } }).catch(() => null);
    if (!r || !r.ok) {
      const code = r ? (await r.json().catch(() => ({}))).error : 'network';
      try { localStorage.removeItem(KEY); } catch (e) {}
      $('err').textContent = { forbidden: 'Mot de passe incorrect.', too_many: 'Trop d’essais, réessayez dans une heure.', unavailable: 'ADMIN_TOKEN n’est pas configuré sur Vercel.' }[code] || 'Impossible de charger les conversations.';
      return show('login');
    }
    const { logs, votes } = await r.json();
    chats = group(logs, votes);
    const canned = logs.filter((l) => l.outcome === 'canned').length;
    const up = votes.filter((v) => v.vote === 'up').length, down = votes.length - up;
    $('stats').textContent = `${chats.length} conversations · ${logs.length} questions (${canned} toutes prêtes) · ${up} 👍 ${down} 👎`;
    show('app'); list();
  };

  const list = () => {
    const idx = chats.map((_, i) => i); if (order === 'new') idx.reverse();
    let lastDay = '', html = '';
    for (const i of idx) {
      const c = chats[i], first = c.msgs[0], d = when(first.at, { weekday: 'long', day: 'numeric', month: 'long' });
      if (d !== lastDay) { html += `<li class="day">${d}</li>`; lastDay = d; }
      const flags = (c.msgs.some((m) => bad(m.outcome)) ? ' ⚠️' : '') + (ENDED.test(c.msgs.at(-1).answer) ? ' 🔒' : '') + c.votes.map((v) => v.vote === 'up' ? '👍' : '👎').join('');
      html += `<li><button type="button" data-i="${i}" aria-current="${i === current}"><span class="meta"><span>${when(first.at, { hour: '2-digit', minute: '2-digit' })} · ${first.lang.toUpperCase()}</span><span>${c.msgs.length} q.${flags}</span></span><span class="q">${esc(first.question)}</span></button></li>`;
    }
    $('list').innerHTML = html || '<li class="empty">Aucune conversation pour l’instant.</li>';
  };

  const read = (i) => {
    current = i; const c = chats[i];
    let html = '';
    for (const m of c.msgs) {
      html += `<div class="msg me">${esc(m.question)}</div>`;
      const ended = ENDED.test(m.answer);
      for (const part of m.answer.replace(ENDED, '').split(/\n-{3,}\n/)) if (part.trim()) html += `<div class="msg bot">${md(part.trim())}</div>`;
      const tags = [LABEL[m.outcome] || (m.outcome !== 'ok' ? m.outcome : ''), ended ? 'conversation fermée' : ''].filter(Boolean);
      const votes = c.votes.filter((v) => v.question === m.question).map((v) => v.vote === 'up' ? '👍' : '👎').join(' ');
      html += `<div class="note">${when(m.at, { hour: '2-digit', minute: '2-digit', second: '2-digit' })} ${tags.map((t) => `<span class="tag${bad(m.outcome) || t === 'conversation fermée' ? ' bad' : ''}">${t}</span>`).join('')}${votes}</div>`;
    }
    $('thread').innerHTML = html;
    $('head').innerHTML = `<b>${when(c.msgs[0].at, { dateStyle: 'full', timeStyle: 'short' })}</b> · ${c.msgs.length} question${c.msgs.length > 1 ? 's' : ''} · ${c.msgs[0].lang.toUpperCase()}`;
    $('app').classList.add('reading'); $('main').scrollTop = 0; list();
  };

  $('list').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) read(+b.dataset.i); });
  document.querySelector('.row').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-order]'); if (!b) return;
    order = b.dataset.order; document.querySelectorAll('[data-order]').forEach((x) => x.setAttribute('aria-pressed', x === b)); list();
  });
  $('back').addEventListener('click', () => $('app').classList.remove('reading'));
  $('logout').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e) {} pw = ''; $('err').textContent = ''; show('login'); });
  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault(); pw = $('pw').value; $('err').textContent = '';
    try { localStorage.setItem(KEY, pw); } catch (err) {}
    load();
  });

  if (pw) load(); else show('login');
})();
</script>
</body>
</html>
