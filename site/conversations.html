<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Conversations · Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Private page, not linked from the site: reads /api/conversations with the ADMIN_TOKEN password */
:root { --bg: #f1f1f4; --fg: #111114; --muted: #8a8a92; --line: rgba(15,15,18,.08); --ink: #2c2d32; --sel: #e6e6ec; }
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }

.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login form { width: min(360px, 100%); display: grid; gap: 12px; background: #fff; padding: 24px; border-radius: 20px; box-shadow: 0 0 0 1px var(--line); }
.login h1 { margin: 0; font-size: 18px; }
.login input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.login button, .btn { padding: 10px 16px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 500; cursor: pointer; }
.err { margin: 0; color: #c2410c; font-size: 13.5px; min-height: 1.2em; }

.app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: #fafafc; }
.side-top { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.side-top h1 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stats { margin: 0; color: var(--muted); font-size: 12.5px; }
.row { display: flex; gap: 6px; }
.row button { flex: 1; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; cursor: pointer; }
.row button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.tool { padding: 5px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 400; cursor: pointer; }
.list { flex: 1; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
.list button { width: 100%; display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; }
.list button:hover { background: #f0f0f4; }
.list button[aria-current="true"] { background: var(--sel); }
.list button { position: relative; padding-left: 24px; }
.list button.unread::before { content: ""; position: absolute; left: 9px; top: 15px; width: 8px; height: 8px; border-radius: 50%; background: #0a84ff; }
.list button.unread .q { font-weight: 600; }
.cta { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 500; cursor: pointer; }
.cta span { color: rgba(255,255,255,.65); font-weight: 400; font-size: 13px; }
.top-tools { display: flex; gap: 6px; }
.top-tools .tool { white-space: nowrap; padding: 5px 8px; }
.side-top h1 { font-size: 16px; }
dialog { width: min(560px, calc(100% - 32px)); border: 0; border-radius: 22px; padding: 0; box-shadow: 0 30px 80px -20px rgba(20,20,40,.45); color: var(--fg); }
dialog::backdrop { background: rgba(15,15,18,.35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.dlg-top { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 6px; }
.dlg-top h2 { margin: 0; font-size: 18px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 20px 8px; }
.kpi { background: var(--bg); border-radius: 14px; padding: 14px; display: grid; gap: 2px; }
.kpi b { font-size: 22px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.dlg-note { margin: 0; padding: 4px 20px 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
@media (max-width: 480px) { .kpis { grid-template-columns: 1fr; } }
.list .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.list .q { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .sum { color: #5a5a62; font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.list .sum:empty { display: none; }
.summary { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line); display: grid; gap: 6px; margin-bottom: 8px; }
.summary p { margin: 0; }
.summary small { color: var(--muted); font-size: 12px; }
.day { padding: 12px 12px 4px; color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

.main { min-height: 0; overflow-y: auto; }
.main-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(241,241,244,.85); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.main-top b { color: var(--fg); font-weight: 600; }
.back { display: none; }
.thread { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: min(600px, 88%); padding: 10px 14px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--ink); color: #fff; border-top-right-radius: 6px; margin-top: 14px; }
.msg.bot { align-self: flex-start; background: #fff; border-top-left-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
.msg.bot a { color: inherit; }
.note { align-self: flex-start; color: var(--muted); font-size: 12px; padding-left: 4px; }
.note .tag { display: inline-block; padding: 1px 7px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px var(--line); margin-right: 4px; }
.note .tag.bad { color: #c2410c; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app.reading .side, .app:not(.reading) .main { display: none; }
  .back { display: inline-block; }
}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form">
    <h1>Conversations de l’agent</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required>
    <button type="submit">Ouvrir</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-top">
      <h1>Conversations <span class="top-tools"><button class="tool" type="button" id="all-read" title="Tout marquer comme lu">Tout lu</button><button class="tool" type="button" id="logout">Déconnexion</button></span></h1>
      <button class="cta" type="button" id="analytics-open">Analytics <span id="analytics-peek"></span></button>
      <p class="stats" id="stats"></p>
      <div class="row" role="group" aria-label="Ordre">
        <button type="button" data-order="new" aria-pressed="true">Plus récentes</button>
        <button type="button" data-order="old" aria-pressed="false">Plus anciennes</button>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
  <main class="main" id="main">
    <div class="main-top"><button class="tool back" type="button" id="back">← Liste</button><span id="head"></span></div>
    <div class="thread" id="thread"><p class="empty">Choisissez une conversation.</p></div>
  </main>
</div>

<dialog id="analytics" aria-labelledby="analytics-title">
  <div class="dlg-top"><h2 id="analytics-title">Analytics</h2><button class="tool" type="button" id="analytics-close">Fermer</button></div>
  <div class="kpis" id="kpis"></div>
  <p class="dlg-note" id="kpi-note"></p>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // The password lives only for this tab (sessionStorage): closing it logs out
  const KEY = 'agent-admin';
  let pw = ''; try { pw = sessionStorage.getItem(KEY) || ''; localStorage.removeItem(KEY); } catch (e) {}
  let chats = [], summaries = {}, systemChars = 0, order = 'new', current = -1;
  // Read state, per browser: the number of questions seen in each conversation (a conversation that went on is unread again)
  const SEEN = 'agent-admin-seen';
  let seen = {}; try { seen = JSON.parse(localStorage.getItem(SEEN) || '{}'); } catch (e) {}
  const saveSeen = () => { try { localStorage.setItem(SEEN, JSON.stringify(seen)); } catch (e) {} };
  const unread = (c) => (seen[c.key] || 0) < c.msgs.length;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // Light markdown, as the agent writes it: **bold** and [label](url)
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|\/|[\w-]+\.html)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : t);
  const when = (iso, o) => new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', ...o });
  const LABEL = { canned: 'réponse toute prête', refusal: 'refus du modèle', max_tokens: 'réponse coupée' };
  const bad = (o) => o.startsWith('api_') || o === 'error' || o === 'refusal' || o === 'max_tokens';
  const ENDED = /\n?\[\[\s*(FIN|END)\s*\]\]\s*$/;

  // Claude Haiku 5.5, in $ per token: input, output, cache read, cache write (5 min)
  const PRICE = { in: 0.10e-6, out: 0.50e-6, cr: 0.01e-6, cw: 0.125e-6 };
  const tok = (chars) => chars / 3;
  // One answer's cost: the billed tokens when they were logged; otherwise an estimate from the text
  // (cached profile + history + question in, answer out).
  const costOf = (m, i, msgs) => {
    // A ready-made answer costs nothing, nor does a call the API turned down
    if (m.outcome === 'canned' || (!m.tokens && !m.answer)) return { usd: 0, exact: true };
    const t = m.tokens;
    if (t) return { usd: t.in * PRICE.in + t.out * PRICE.out + t.cr * PRICE.cr + t.cw * PRICE.cw, exact: true };
    const history = msgs.slice(Math.max(0, i - 3), i).reduce((n, x) => n + x.question.length + Math.min(x.answer.length, 1200), 0);
    return { usd: tok(systemChars) * PRICE.cr + tok(history + m.question.length) * PRICE.in + tok(m.answer.length) * PRICE.out, exact: false };
  };
  const chatCost = (c) => c.msgs.reduce((a, m, i) => { const x = costOf(m, i, c.msgs); return { usd: a.usd + x.usd, exact: a.exact && x.exact }; }, { usd: 0, exact: true });
  const money = ({ usd, exact }) => (exact ? '' : '≈ ') + (usd === 0 ? '0 $' : usd < 0.01 ? (usd * 100).toFixed(usd < 0.001 ? 3 : 2).replace('.', ',') + ' ¢' : usd.toFixed(3).replace('.', ',') + ' $');

  // Same grouping as agent/conversations.ts: the keys must match the server's for the summaries
  const group = (logs, votes) => {
    const out = [], byCid = new Map();
    for (const l of [...logs].sort((a, b) => a.at.localeCompare(b.at))) {
      if (l.cid) {
        if (!byCid.has(l.cid)) { const c = { key: l.cid, msgs: [], votes: [] }; byCid.set(l.cid, c); out.push(c); }
        byCid.get(l.cid).msgs.push(l);
      } else if (l.turn === 1 || !out.length || out.at(-1).msgs[0].cid) out.push({ key: 't' + l.at, msgs: [l], votes: [] });
      else out.at(-1).msgs.push(l);
    }
    for (const v of votes) if (v.cid && byCid.has(v.cid)) byCid.get(v.cid).votes.push(v);
    return out;
  };

  const show = (which) => { $('login').hidden = which !== 'login'; $('app').hidden = which !== 'app'; };
  const api = (opts = {}) => fetch('/api/conversations', { ...opts, cache: 'no-store', credentials: 'omit', headers: { authorization: 'Bearer ' + pw, ...(opts.body ? { 'content-type': 'application/json' } : {}) } }).catch(() => null);
  const ERR = { forbidden: 'Mot de passe incorrect.', too_many: 'Trop d’essais, réessayez dans une heure.', locked: 'Accès verrouillé pour aujourd’hui après trop d’essais ratés.', unavailable: 'Accès fermé : ADMIN_TOKEN manque sur Vercel.' };
  const logout = (msg = '') => { try { sessionStorage.removeItem(KEY); } catch (e) {} pw = ''; chats = []; summaries = {}; current = -1; $('list').innerHTML = $('thread').innerHTML = ''; $('err').textContent = msg; $('pw').value = ''; show('login'); };

  const load = async () => {
    const r = await api();
    if (!r || !r.ok) return logout(ERR[r ? (await r.json().catch(() => ({}))).error : ''] || 'Impossible de charger les conversations.');
    const data = await r.json();
    systemChars = data.systemChars || 0; summaries = data.summaries || {};
    chats = group(data.logs, data.votes);
    const canned = data.logs.filter((l) => l.outcome === 'canned').length;
    const up = data.votes.filter((v) => v.vote === 'up').length, down = data.votes.length - up;
    const total = chats.reduce((a, c) => { const x = chatCost(c); return { usd: a.usd + x.usd, exact: a.exact && x.exact }; }, { usd: 0, exact: true });
    $('stats').textContent = `${chats.length} conversations · ${data.logs.length} questions (${canned} toutes prêtes) · ${money(total)} · ${up} 👍 ${down} 👎`;
    show('app'); analytics(); list(); summarize();
  };

  // Summaries missing (or out of date: the conversation went on) are written one after the other, newest first
  const stale = (c) => !summaries[c.key] || summaries[c.key].n !== c.msgs.length;
  const summarize = async () => {
    for (const c of [...chats].reverse().filter(stale).slice(0, 30)) {
      if (!pw) return;
      const r = await api({ method: 'POST', body: JSON.stringify({ key: c.key }) });
      if (!r || !r.ok) return;
      summaries[c.key] = await r.json();
      analytics(); list(); if (chats[current] === c) read(current, true);
    }
  };

  // Analytics: what the agent costs, and what the ready-made answers to suggestions save
  const SUM_PRICE = (t) => t ? t.in * PRICE.in + t.out * PRICE.out : 0;
  const pct = (x) => (x * 100).toFixed(0) + ' %';
  const analytics = () => {
    const all = chats.flatMap((c) => c.msgs.map((m, i) => ({ m, cost: costOf(m, i, c.msgs) })));
    const model = all.filter((x) => x.m.outcome !== 'canned' && x.cost.usd > 0);
    const canned = all.filter((x) => x.m.outcome === 'canned').length;
    const spent = model.reduce((a, x) => a + x.cost.usd, 0);
    const summariesCost = Object.values(summaries).reduce((a, s) => a + SUM_PRICE(s.tokens), 0);
    const exact = model.every((x) => x.cost.exact);
    // A suggestion answered by the model would have cost about as much as an average model answer
    const avgAnswer = model.length ? spent / model.length : 0;
    const k = (value, label) => `<div class="kpi"><b>${value}</b><small>${label}</small></div>`;
    $('kpis').innerHTML =
      k(money({ usd: spent, exact }), `Coût total des réponses du modèle (${model.length} appels)`) +
      k(money({ usd: chats.length ? spent / chats.length : 0, exact }), `Coût moyen par conversation (${chats.length} conversations)`) +
      k(all.length ? pct(canned / all.length) : '—', `Questions venues d’une suggestion (${canned} sur ${all.length})`) +
      k(money({ usd: canned * avgAnswer, exact: false }), `Économisé par les réponses toutes prêtes (${canned} × ${money({ usd: avgAnswer, exact: true })} en moyenne)`);
    $('kpi-note').textContent = `Tarif Claude Haiku 5.5. Les résumés de cette page ont coûté ${money({ usd: summariesCost, exact: true })} en plus.${exact ? '' : ' « ≈ » : une partie des anciens messages a été enregistrée sans ses tokens, leur coût est estimé à partir du texte.'} Les réponses toutes prêtes comptent aussi les questions de départ.`;
    $('analytics-peek').textContent = money({ usd: spent, exact });
  };

  const list = () => {
    const idx = chats.map((_, i) => i); if (order === 'new') idx.reverse();
    let lastDay = '', html = '';
    for (const i of idx) {
      const c = chats[i], first = c.msgs[0], d = when(first.at, { weekday: 'long', day: 'numeric', month: 'long' });
      if (d !== lastDay) { html += `<li class="day">${esc(d)}</li>`; lastDay = d; }
      const flags = (c.msgs.some((m) => bad(m.outcome)) ? ' ⚠️' : '') + (ENDED.test(c.msgs.at(-1).answer) ? ' 🔒' : '') + c.votes.map((v) => v.vote === 'up' ? '👍' : '👎').join('');
      const sum = summaries[c.key]?.text || '';
      html += `<li><button type="button" class="${unread(c) ? 'unread' : ''}" data-i="${i}" aria-current="${i === current}"><span class="meta"><span>${when(first.at, { hour: '2-digit', minute: '2-digit' })} · ${esc(first.lang.toUpperCase())} · ${money(chatCost(c))}</span><span>${c.msgs.length} q.${flags}</span></span><span class="q">${esc(first.question)}</span><span class="sum">${esc(sum)}</span></button></li>`;
    }
    $('list').innerHTML = html || '<li class="empty">Aucune conversation pour l’instant.</li>';
  };

  const read = (i, keepScroll) => {
    current = i; const c = chats[i];
    if (unread(c)) { seen[c.key] = c.msgs.length; saveSeen(); }
    const sum = summaries[c.key], cost = chatCost(c);
    let html = `<div class="summary"><p>${sum ? esc(sum.text) + (stale(c) ? ' <small>(résumé en cours de mise à jour…)</small>' : '') : '<small>Résumé en cours…</small>'}</p><small>Coût ${cost.exact ? '' : 'estimé '}de la conversation : ${money(cost)}${cost.exact ? '' : ' (tokens non enregistrés à l’époque, estimation à partir du texte)'}</small></div>`;
    c.msgs.forEach((m, j) => {
      html += `<div class="msg me">${esc(m.question)}</div>`;
      const ended = ENDED.test(m.answer);
      for (const part of m.answer.replace(ENDED, '').split(/\n-{3,}\n/)) if (part.trim()) html += `<div class="msg bot">${md(part.trim())}</div>`;
      const tags = [LABEL[m.outcome] || (m.outcome !== 'ok' ? m.outcome : ''), ended ? 'conversation fermée' : ''].filter(Boolean);
      const votes = c.votes.filter((v) => v.question === m.question).map((v) => v.vote === 'up' ? '👍' : '👎').join(' ');
      html += `<div class="note">${when(m.at, { hour: '2-digit', minute: '2-digit', second: '2-digit' })} · ${money(costOf(m, j, c.msgs))} ${tags.map((t) => `<span class="tag${bad(m.outcome) || t === 'conversation fermée' ? ' bad' : ''}">${esc(t)}</span>`).join('')}${votes}</div>`;
    });
    $('thread').innerHTML = html;
    $('head').innerHTML = `<b>${when(c.msgs[0].at, { dateStyle: 'full', timeStyle: 'short' })}</b> · ${c.msgs.length} question${c.msgs.length > 1 ? 's' : ''} · ${esc(c.msgs[0].lang.toUpperCase())}`;
    $('app').classList.add('reading'); if (!keepScroll) $('main').scrollTop = 0; list();
  };

  $('list').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) read(+b.dataset.i); });
  document.querySelector('.row').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-order]'); if (!b) return;
    order = b.dataset.order; document.querySelectorAll('[data-order]').forEach((x) => x.setAttribute('aria-pressed', x === b)); list();
  });
  $('back').addEventListener('click', () => $('app').classList.remove('reading'));
  $('logout').addEventListener('click', () => logout());
  $('analytics-open').addEventListener('click', () => $('analytics').showModal());
  $('analytics-close').addEventListener('click', () => $('analytics').close());
  $('analytics').addEventListener('click', (e) => { if (e.target === $('analytics')) $('analytics').close(); });
  $('all-read').addEventListener('click', () => { for (const c of chats) seen[c.key] = c.msgs.length; saveSeen(); list(); });
  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault(); pw = $('pw').value; $('err').textContent = '';
    try { sessionStorage.setItem(KEY, pw); } catch (err) {}
    load();
  });

  if (pw) load(); else show('login');
})();
</script>
</body>
</html>
